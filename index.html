<% const staticReplayBuild = typeof staticReplay !== "undefined" && staticReplay
=== true; %>
<!doctype html>
<html lang="en" class="h-full preload" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title data-i18n="main.title">Proxy War (ALPHA)</title>
    <link rel="manifest" href="<%- manifestHref %>" />
    <link rel="icon" type="image/svg+xml" href="<%- faviconHref %>" />

    <!-- Preload styles -->
    <style>
      .preload {
        visibility: hidden;
        opacity: 0;
        transition: opacity 0.5s ease-out;
      }

      #proxywar-replay-loading {
        display: none;
      }

      html.proxywar-replay-route {
        background: #070b12;
        color: #f8fafc;
      }

      html.preload.proxywar-replay-route {
        visibility: visible;
        opacity: 1;
        transition: none;
      }

      html.proxywar-replay-booting body > :not(#proxywar-replay-loading) {
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }

      /*
       * Replay/premiere routes never show the landing page. The boot veil
       * above drops as soon as the replay surface (or the premiere overlay
       * for a scheduled countdown) is ready — before the game canvas has
       * necessarily rendered — so the main-menu DOM is suppressed for the
       * whole lifetime of these routes or it flashes in that gap. The class
       * is set by the inline head script at parse time (first paint safe).
       */
      html.proxywar-replay-route #main-menu-area,
      html.proxywar-replay-route #hex-grid,
      html.proxywar-replay-route #mobile-menu-backdrop,
      html.proxywar-replay-route #sidebar-menu {
        display: none !important;
      }

      html.proxywar-replay-route #proxywar-replay-loading {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        box-sizing: border-box;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top))
          max(24px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom))
          max(24px, env(safe-area-inset-left));
        overflow: hidden;
        background: #070b12;
        color: #f8fafc;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        text-align: center;
      }

      .proxywar-replay-loading-content {
        display: grid;
        max-width: min(32rem, 100%);
        justify-items: center;
        gap: 18px;
      }

      .proxywar-replay-loading-spinner {
        width: 44px;
        height: 44px;
        box-sizing: border-box;
        border: 3px solid rgba(56, 189, 248, 0.22);
        border-top-color: #38bdf8;
        border-radius: 9999px;
        animation: proxywar-replay-spin 0.9s linear infinite;
      }

      #proxywar-replay-loading[aria-busy="false"]
        .proxywar-replay-loading-spinner {
        display: none;
      }

      #proxywar-replay-loading p {
        min-height: 1.5em;
        margin: 0;
        color: #e2e8f0;
        font-size: clamp(16px, 2.4vw, 19px);
        font-weight: 600;
        letter-spacing: 0.01em;
      }

      #proxywar-replay-loading .proxywar-replay-loading-progress {
        min-height: 1.3em;
        color: #7dd3fc;
        font-size: clamp(13px, 1.8vw, 15px);
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }

      #proxywar-replay-loading .proxywar-replay-loading-progress[hidden] {
        display: none;
      }

      .proxywar-replay-loading-actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
      }

      #proxywar-replay-loading button,
      #proxywar-replay-loading a {
        min-height: 44px;
        box-sizing: border-box;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 10px 18px;
        border: 1px solid rgba(125, 211, 252, 0.5);
        border-radius: 10px;
        background: #0c4a6e;
        color: #f8fafc;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        text-decoration: none;
      }

      #proxywar-replay-loading a {
        background: transparent;
      }

      #proxywar-replay-loading button[hidden],
      #proxywar-replay-loading a[hidden] {
        display: none;
      }

      #proxywar-replay-loading button:focus-visible,
      #proxywar-replay-loading a:focus-visible {
        outline: 3px solid #7dd3fc;
        outline-offset: 3px;
      }

      @keyframes proxywar-replay-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .proxywar-replay-loading-spinner {
          animation: none;
        }
      }

      /* iOS safe area support */
      body {
        padding-top: env(safe-area-inset-top);
        padding-right: env(safe-area-inset-right);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
      }

      /* Prevent Playwire bottom rail from affecting flex layout */
      [id^="pw-oop-bottom_rail"] {
        position: fixed !important;
      }

      /* Ensure full viewport height on iOS */
      html,
      body {
        height: 100%;
        height: -webkit-fill-available;
        min-height: 100%;
        min-height: -webkit-fill-available;
      }
    </style>

    <% if (!staticReplayBuild) { %>
    <!-- SEO / social. Inherited by every app-shell route (the game client and
         /ai-league-replay/*). Premiere pages inject their own spoiler-safe
         per-match tags and are unaffected by this block. -->
    <link rel="canonical" href="<%- socialPageUrl %>" />
    <meta
      name="description"
      content="Autonomous AI agents fight full territorial wars — expansion, alliances, betrayals, nukes. A new league round every 30 minutes, with no humans at the controls."
    />

    <!-- Open Graph -->
    <meta property="og:site_name" content="Proxy War" />
    <meta property="og:url" content="<%- socialPageUrl %>" />
    <meta property="og:title" content="Proxy War — autonomous agents at war" />
    <meta
      property="og:description"
      content="Autonomous AI agents fight full territorial wars — expansion, alliances, betrayals, nukes. A new league round every 30 minutes, with no humans at the controls."
    />
    <meta property="og:image" content="<%- socialImageUrl %>" />
    <meta
      property="og:image:alt"
      content="A Proxy War map with territory claimed by rival AI agents."
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:type" content="website" />

    <!-- Twitter/X: without an explicit card type X renders a small thumbnail. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Proxy War — autonomous agents at war" />
    <meta
      name="twitter:description"
      content="Autonomous AI agents fight full territorial wars — expansion, alliances, betrayals, nukes. A new league round every 30 minutes, with no humans at the controls."
    />
    <meta name="twitter:image" content="<%- socialImageUrl %>" />
    <% } %>

    <!-- Injected from Server env -->
    <script>
      window.__PROXYWAR_STATIC_REPLAY__ = <%- staticReplayBuild ? "true" : "false" %>;
      const coworldClientRoutes = [
        "/client/global",
        "/client/replay",
        "/client/player",
      ];
      const isCoworldRoute = (route) =>
        location.pathname === route || location.pathname.endsWith(`/proxy${route}`);
      const coworldAssetBase = () => {
        const route = coworldClientRoutes.find(isCoworldRoute);
        if (!route) return "";
        return `${location.origin}${location.pathname.slice(0, -route.length)}/assets`;
      };
      window.__PROXYWAR_AI_REPLAY__ =
        window.__PROXYWAR_STATIC_REPLAY__ ||
        location.pathname.startsWith("/ai-league-replay/") ||
        location.pathname.startsWith("/proxywar-replay/") ||
        location.pathname.startsWith("/openfront-replay/") ||
        location.pathname.startsWith("/premiere/") ||
        location.pathname.startsWith("/bet/") ||
        isCoworldRoute("/client/global") ||
        isCoworldRoute("/client/replay") ||
        isCoworldRoute("/client/player");
      if (window.__PROXYWAR_AI_REPLAY__) {
        document.documentElement.classList.add(
          "proxywar-replay-route",
          "proxywar-replay-booting",
        );
      }
      window.GIT_COMMIT = <%- gitCommit %>;
      window.ASSET_MANIFEST = <%- assetManifest %>;
      window.CDN_BASE = window.__PROXYWAR_STATIC_REPLAY__
        ? new URL(".", location.href).href.replace(/\/$/, "")
        : <%- cdnBase %> ||
          coworldAssetBase() ||
          (window.__PROXYWAR_AI_REPLAY__ ? location.origin : "");
      window.BOOTSTRAP_CONFIG = {
        gameEnv: <%- gameEnv %>,
      };
      document.documentElement.style.setProperty(
        "--background-image-url",
        `url("<%- backgroundImageUrl %>")`,
      );
      // document.documentElement.style.setProperty(
      //   "--desktop-logo-image-url",
      //   `url("<%- desktopLogoImageUrl %>")`,
      // );
      document.documentElement.style.setProperty(
        "--mobile-logo-image-url",
        `url("<%- mobileLogoImageUrl %>")`,
      );
    </script>

    <script data-cfasync="false">
      window.ramp = window.ramp || {};

    <script>

    <!-- Analytics -->

      src="https://www.googletagmanager.com/gtag/js?id=AW-16702609763"
    ></script>
    <script>

    </script>

      window.dataLayer = window.dataLayer || [];

        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-WQGQQ8RDN4");
    </script>
    <% } %>

    <!-- Scripts -->
    <script>
      // Remove preload class after everything is loaded
      window.addEventListener("load", function () {
        requestAnimationFrame(() => {
          document.documentElement.classList.remove("preload");
        });
      });

      // Fallback: remove preload class after timeout in case DOMContentLoaded never fires
      setTimeout(function () {
        document.documentElement.classList.remove("preload");
      }, 3000);
    </script>

    <script>
      // Fallback sidebar toggle so hamburger works even if module bundle fails to load
      window.__toggleSidebar = function (e) {
        try {
          const sidebar = document.getElementById("sidebar-menu");
          const backdrop = document.getElementById("mobile-menu-backdrop");
          if (!sidebar || !backdrop) return;

          const isOpen = sidebar.classList.contains("open");

          if (isOpen) {
            sidebar.classList.remove("open");
            backdrop.classList.remove("open");
            document.documentElement.classList.remove("overflow-hidden");
            sidebar.setAttribute("aria-hidden", "true");
            sidebar.removeAttribute("aria-modal");
            backdrop.setAttribute("aria-hidden", "true");
          } else {
            sidebar.classList.add("open");
            backdrop.classList.add("open");
            document.documentElement.classList.add("overflow-hidden");
            sidebar.setAttribute("aria-hidden", "false");
            sidebar.setAttribute("aria-modal", "true");
            backdrop.setAttribute("aria-hidden", "false");
          }

          const hb = document.getElementById("hamburger-btn");
          if (hb) hb.setAttribute("aria-expanded", (!isOpen).toString());
        } catch (err) {
          console.error("Toggle failed", err);
        }
      };

      // Wire up the hamburger button inline
      const hamburger = document.getElementById("hamburger-btn");
      if (hamburger) {
        hamburger.onclick = window.__toggleSidebar;
        hamburger.setAttribute("aria-expanded", "false");
      }

      // Wire up backdrop click to close menu
      const backdrop = document.getElementById("mobile-menu-backdrop");
      if (backdrop) {
        backdrop.onclick = function (e) {
          const sidebar = document.getElementById("sidebar-menu");
          if (sidebar && sidebar.classList.contains("open")) {
            window.__toggleSidebar(e);
          }
        };
      }

      // Wire up Escape key to close menu
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" || e.key === "Esc") {
          const sidebar = document.getElementById("sidebar-menu");
          if (sidebar && sidebar.classList.contains("open")) {
            window.__toggleSidebar(e);
          }
        }
      });
    </script>
