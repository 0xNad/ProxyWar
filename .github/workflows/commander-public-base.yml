name: Commander public base immutable materialization
run-name: Commander public base ${{ inputs.source_sha }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact protected-main Commander public-base source
        required: true
        type: string
      source_ci_run_id:
        description: Successful exact-source push CI run ID
        required: true
        type: string
      source_ci_run_attempt:
        description: Exact-source CI run attempt
        required: true
        type: string
      recovery_artifact_id:
        description: Optional immutable failed-run public-base boundary artifact ID
        required: false
        default: ""
        type: string

concurrency:
  group: commander-public-base-${{ inputs.source_sha }}
  cancel-in-progress: false

permissions:
  actions: read
  artifact-metadata: write
  attestations: write
  contents: write
  id-token: write
  packages: write

env:
  SOURCE_SHA: ${{ inputs.source_sha }}
  SOURCE_CI_RUN_ID: ${{ inputs.source_ci_run_id }}
  SOURCE_CI_RUN_ATTEMPT: ${{ inputs.source_ci_run_attempt }}
  RECOVERY_ARTIFACT_ID: ${{ inputs.recovery_artifact_id }}
  COWORLD_CLI_VERSION: 0.1.42

jobs:
  materialize:
    name: Build, attest and materialize one public base
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: coworld-production
    steps:
      - name: Checkout exact protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Authorize exact protected main and push CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_ACTOR" = 0xNad
          test "$GITHUB_TRIGGERING_ACTOR" = 0xNad
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_REPOSITORY" = 0xNad/ProxyWar
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .visibility)" = public
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .protected)" = true
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_CI_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOURCE_CI_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          test -z "$RECOVERY_ARTIFACT_ID" || [[ "$RECOVERY_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          test "$GITHUB_SHA" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          node .github/scripts/commander-xp-main-authorization.mjs "$SOURCE_SHA" \
            > "$RUNNER_TEMP/initial-main-authorization.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_CI_RUN_ID" \
            > "$RUNNER_TEMP/source-ci.json"
          jq -e --arg source "$SOURCE_SHA" --argjson attempt "$SOURCE_CI_RUN_ATTEMPT" '
            .status == "completed" and .conclusion == "success" and
            .head_sha == $source and .run_attempt == $attempt and
            .head_branch == "main" and .path == ".github/workflows/ci.yml" and
            .actor.login == "0xNad" and .triggering_actor.login == "0xNad" and
            .head_repository.full_name == "0xNad/ProxyWar" and
            .event == "push"
          ' "$RUNNER_TEMP/source-ci.json" >/dev/null
          SOURCE_TREE_SHA=$(git rev-parse HEAD^{tree})
          FENCE_HASH=$(printf '%s\n%s\n' "$SOURCE_SHA" commander-public-base-v1 | sha256sum | cut -d' ' -f1)
          FENCE_REF="refs/tags/commander-public-base-v1/$FENCE_HASH"
          {
            echo "SOURCE_TREE_SHA=$SOURCE_TREE_SHA"
            echo "FENCE_HASH=$FENCE_HASH"
            echo "FENCE_REF=$FENCE_REF"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.8.12"
          enable-cache: false

      - name: Install exact source and Coworld dependencies
        run: |
          set -euo pipefail
          node .github/scripts/npm-ci-with-retry.mjs --ignore-scripts
          npm ci --ignore-scripts --prefix coworld-adapter
          export UV_NO_CACHE=1
          uv venv "$RUNNER_TEMP/coworld-venv" --python 3.12
          test "$(uv --version)" = "uv 0.8.12"
          uv pip install --python "$RUNNER_TEMP/coworld-venv/bin/python" \
            --require-hashes \
            -r .github/scripts/commander-xp-coworld-requirements.lock.txt
          test "$($RUNNER_TEMP/coworld-venv/bin/python -c 'import importlib.metadata; print(importlib.metadata.version("coworld"))')" = "$COWORLD_CLI_VERSION"
          uv pip freeze --python "$RUNNER_TEMP/coworld-venv/bin/python" \
            | LC_ALL=C sort > "$RUNNER_TEMP/coworld-runtime-inventory.txt"
          cmp .github/scripts/commander-xp-coworld-inventory.lock.txt \
            "$RUNNER_TEMP/coworld-runtime-inventory.txt"
          COWORLD_RUNTIME_INVENTORY_SHA256=$(sha256sum "$RUNNER_TEMP/coworld-runtime-inventory.txt" | cut -d' ' -f1)
          CACHE="$RUNNER_TEMP/coworld-cache"
          mkdir -m 700 "$CACHE"
          {
            echo "COWORLD_BIN=$RUNNER_TEMP/coworld-venv/bin/coworld"
            echo "COWORLD_PYTHON=$RUNNER_TEMP/coworld-venv/bin/python"
            echo "COWORLD_RUNTIME_INVENTORY_SHA256=$COWORLD_RUNTIME_INVENTORY_SHA256"
            echo "XDG_CACHE_HOME=$CACHE"
          } >> "$GITHUB_ENV"

      - name: Rebuild exact source provenance
        run: |
          set -euo pipefail
          git archive --format=tar "$SOURCE_SHA" > "$RUNNER_TEMP/commander-public-base-source.tar"
          SOURCE_ARCHIVE_SHA256=$(sha256sum "$RUNNER_TEMP/commander-public-base-source.tar" | cut -d' ' -f1)
          BUILD_SOURCE="$RUNNER_TEMP/commander-public-base-source"
          mkdir -m 700 "$BUILD_SOURCE"
          tar -xf "$RUNNER_TEMP/commander-public-base-source.tar" -C "$BUILD_SOURCE"
          node .github/scripts/commander-public-base-provenance.mjs \
            "$SOURCE_SHA" "$SOURCE_TREE_SHA" "$SOURCE_ARCHIVE_SHA256" \
            "$RUNNER_TEMP/commander-public-base-provenance-v1.json" \
            > "$RUNNER_TEMP/commander-public-base-provenance-result.json"
          SOURCE_PROVENANCE_SHA256=$(jq -r .provenanceSha256 "$RUNNER_TEMP/commander-public-base-provenance-v1.json")
          [[ "$SOURCE_PROVENANCE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          jq -e --arg source "$SOURCE_SHA" --arg tree "$SOURCE_TREE_SHA" '
            .sourceSha == $source and .behaviorSourceSha == $source and
            .adapterSourceSha == $source and .sourceTreeSha == $tree and
            .behaviorSourceTreeSha == $tree and .adapterSourceTreeSha == $tree and
            .platform == "linux/amd64"
          ' "$RUNNER_TEMP/commander-public-base-provenance-v1.json" >/dev/null
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          {
            echo "BUILD_SOURCE=$BUILD_SOURCE"
            echo "SOURCE_ARCHIVE_SHA256=$SOURCE_ARCHIVE_SHA256"
            echo "SOURCE_PROVENANCE_SHA256=$SOURCE_PROVENANCE_SHA256"
          } >> "$GITHUB_ENV"

      - name: Run exact-source public-base gates
        run: |
          set -euo pipefail
          npm exec -- tsc --noEmit --pretty false
          npm run typecheck --prefix coworld-adapter
          "$COWORLD_PYTHON" .github/scripts/commander-public-base-materialize.test.py
          "$COWORLD_PYTHON" .github/scripts/commander-public-base-recovery-archive.test.py
          node --test \
            .github/scripts/commander-public-base-provenance.test.mjs \
            .github/scripts/commander-public-base-recovery.test.mjs \
            .github/scripts/commander-public-base-workflow.test.mjs \
            .github/scripts/commander-xp-ghcr-adoption.test.mjs \
            .github/scripts/commander-xp-main-authorization.test.mjs \
            .github/scripts/commander-xp-workflow-shell-syntax.test.mjs \
            .github/scripts/coworld-authenticated-command.test.mjs
          npx vitest \
            tests/server/CommanderPromptBuilder.test.ts \
            tests/server/CommanderStateBuilder.test.ts \
            tests/coworld/CommanderProductionPlayer.test.ts \
            tests/coworld/CommanderStarterContract.test.ts \
            --run --maxWorkers=1

      - name: Build one exact linux amd64 image
        run: |
          set -euo pipefail
          POLICY_TAG="ghcr.io/0xnad/proxywar-commander-public-base:$SOURCE_SHA"
          docker build --platform linux/amd64 \
            --build-arg "COMMANDER_PUBLIC_BASE_SOURCE_SHA=$SOURCE_SHA" \
            --build-arg "COMMANDER_PUBLIC_BASE_SOURCE_TREE_SHA=$SOURCE_TREE_SHA" \
            --build-arg "COMMANDER_PUBLIC_BASE_SOURCE_PROVENANCE_SHA256=$SOURCE_PROVENANCE_SHA256" \
            -f "$BUILD_SOURCE/coworld-adapter/Dockerfile.commander-public-base" \
            -t "$POLICY_TAG" "$BUILD_SOURCE"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$POLICY_TAG")" = linux/amd64
          POLICY_CONFIG_DIGEST=$(docker image inspect --format '{{.Id}}' "$POLICY_TAG")
          [[ "$POLICY_CONFIG_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker image inspect "$POLICY_TAG" > "$RUNNER_TEMP/policy-image-inspect.json"
          jq -e --arg source "$SOURCE_SHA" --arg tree "$SOURCE_TREE_SHA" --arg provenance "$SOURCE_PROVENANCE_SHA256" '
            length == 1 and .[0].Architecture == "amd64" and .[0].Os == "linux" and
            .[0].Config.Labels["org.opencontainers.image.source"] == "https://github.com/0xNad/ProxyWar" and
            .[0].Config.Labels["org.opencontainers.image.revision"] == $source and
            .[0].Config.Labels["com.proxywar.commander-public-base.source-sha"] == $source and
            .[0].Config.Labels["com.proxywar.commander-public-base.source-tree-sha"] == $tree and
            .[0].Config.Labels["com.proxywar.commander-public-base.behavior-source-sha"] == $source and
            .[0].Config.Labels["com.proxywar.commander-public-base.behavior-source-tree-sha"] == $tree and
            .[0].Config.Labels["com.proxywar.commander-public-base.adapter-source-sha"] == $source and
            .[0].Config.Labels["com.proxywar.commander-public-base.adapter-source-tree-sha"] == $tree and
            .[0].Config.Labels["com.proxywar.commander-public-base.source-provenance-sha256"] == $provenance and
            .[0].Config.Cmd == ["node","--import","tsx","/app/proxywar/coworld-adapter/src/commander-player.ts"] and
            ((.[0].Config.Env | join("\n")) | test("COMMANDER_XP|--arm|PROXYWAR_TUNE_SPATIAL") | not)
          ' "$RUNNER_TEMP/policy-image-inspect.json" >/dev/null
          POLICY_ROOTFS_BYTES=$(docker run --rm --entrypoint /usr/bin/du "$POLICY_TAG" -sx -B1 / | awk '{print $1}')
          [[ "$POLICY_ROOTFS_BYTES" =~ ^[0-9]+$ ]]
          test "$POLICY_ROOTFS_BYTES" -lt $((512 * 1024 * 1024))
          docker run --rm --entrypoint /bin/sh "$POLICY_TAG" -ec '
            test -f /app/proxywar/coworld-adapter/src/commander-player.ts
            test -f /app/proxywar/coworld-adapter/src/commander-production-runtime.ts
            test -f /app/proxywar/src/server/agents/CommanderPromptBuilder.ts
            test -f /app/proxywar/src/server/agents/CommanderStateBuilder.ts
            test -f /app/proxywar/src/server/agents/StrategicCommanderTypes.ts
            test ! -e /app/proxywar/resources
            node --import tsx -e '\''Promise.all([import("/app/proxywar/coworld-adapter/src/commander-player.ts"),import("/app/proxywar/coworld-adapter/src/commander-production-runtime.ts"),import("/app/proxywar/src/server/agents/CommanderPromptBuilder.ts"),import("/app/proxywar/src/server/agents/CommanderStateBuilder.ts"),import("/app/proxywar/src/server/agents/StrategicCommanderTypes.ts")])'\''
          '
          for RELATIVE in \
            coworld-adapter/commander-starter/commander-player.ts \
            coworld-adapter/commander-starter/commander-production-runtime.ts \
            src/server/agents/CommanderPromptBuilder.ts \
            src/server/agents/CommanderStateBuilder.ts \
            src/server/agents/StrategicCommanderTypes.ts; do
            HOST_SHA=$(sha256sum "$BUILD_SOURCE/$RELATIVE" | cut -d' ' -f1)
            case "$RELATIVE" in
              coworld-adapter/commander-starter/commander-player.ts) IMAGE_RELATIVE=coworld-adapter/src/commander-player.ts ;;
              coworld-adapter/commander-starter/commander-production-runtime.ts) IMAGE_RELATIVE=coworld-adapter/src/commander-production-runtime.ts ;;
              *) IMAGE_RELATIVE="$RELATIVE" ;;
            esac
            IMAGE_SHA=$(docker run --rm --entrypoint sha256sum "$POLICY_TAG" "/app/proxywar/$IMAGE_RELATIVE" | cut -d' ' -f1)
            test "$IMAGE_SHA" = "$HOST_SHA"
          done
          {
            echo "POLICY_TAG=$POLICY_TAG"
            echo "POLICY_CONFIG_DIGEST=$POLICY_CONFIG_DIGEST"
            echo "POLICY_ROOTFS_BYTES=$POLICY_ROOTFS_BYTES"
          } >> "$GITHUB_ENV"

      - name: Resolve one exact failed-run boundary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STATE_ROOT="$RUNNER_TEMP/commander-public-base-state"
          mkdir -m 700 "$STATE_ROOT"
          RECOVERY_STAGE=""
          if test -n "$RECOVERY_ARTIFACT_ID"; then
            METADATA="$RUNNER_TEMP/recovery-artifact.json"
            ARCHIVE="$RUNNER_TEMP/recovery-artifact.zip"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$RECOVERY_ARTIFACT_ID" \
              | "$COWORLD_PYTHON" .github/scripts/commander-public-base-recovery-archive.py \
                copy metadata "$METADATA" > "$RUNNER_TEMP/recovery-metadata-size.txt"
            test "$(jq -r .id "$METADATA")" = "$RECOVERY_ARTIFACT_ID"
            test "$(jq -r .expired "$METADATA")" = false
            RECOVERY_DECLARED_BYTES=$(jq -r .size_in_bytes "$METADATA")
            [[ "$RECOVERY_DECLARED_BYTES" =~ ^[1-9][0-9]*$ ]]
            test "$RECOVERY_DECLARED_BYTES" -le $((32 * 1024 * 1024))
            RECOVERY_RUN_ID=$(jq -r .workflow_run.id "$METADATA")
            [[ "$RECOVERY_RUN_ID" =~ ^[1-9][0-9]*$ ]]
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RECOVERY_RUN_ID" \
              | "$COWORLD_PYTHON" .github/scripts/commander-public-base-recovery-archive.py \
                copy metadata "$RUNNER_TEMP/recovery-run.json" > "$RUNNER_TEMP/recovery-run-size.txt"
            RECOVERY_RUN_ATTEMPT=$(jq -r .run_attempt "$RUNNER_TEMP/recovery-run.json")
            jq -e --arg source "$SOURCE_SHA" '
              .status == "completed" and .conclusion != "success" and
              .head_sha == $source and .head_branch == "main" and
              .path == ".github/workflows/commander-public-base.yml" and
              .actor.login == "0xNad" and .triggering_actor.login == "0xNad" and
              .head_repository.full_name == "0xNad/ProxyWar" and
              .repository.full_name == "0xNad/ProxyWar" and
              .event == "workflow_dispatch"
            ' "$RUNNER_TEMP/recovery-run.json" >/dev/null
            gh api -H "Accept: application/vnd.github+json" \
              "repos/$GITHUB_REPOSITORY/actions/artifacts/$RECOVERY_ARTIFACT_ID/zip" \
              | "$COWORLD_PYTHON" .github/scripts/commander-public-base-recovery-archive.py \
                copy archive "$ARCHIVE" > "$RUNNER_TEMP/recovery-archive-size.txt"
            "$COWORLD_PYTHON" .github/scripts/commander-public-base-recovery-archive.py \
              extract "$ARCHIVE" "$STATE_ROOT" > "$RUNNER_TEMP/recovery-extraction.txt"
            test "$(find "$STATE_ROOT" -type l | wc -l | tr -d ' ')" = 0
            RECOVERY_RESULT=$(node .github/scripts/commander-public-base-recovery.mjs validate \
              "$STATE_ROOT" "$SOURCE_SHA" "$SOURCE_TREE_SHA" "$FENCE_REF")
            RECOVERY_STAGE=$(jq -r .stage <<< "$RECOVERY_RESULT")
            cmp "$STATE_ROOT/source-provenance.json" \
              "$RUNNER_TEMP/commander-public-base-provenance-v1.json"
            EXPECTED_NAME="commander-public-base-boundary-$RECOVERY_STAGE-$SOURCE_SHA-$RECOVERY_RUN_ID-$RECOVERY_RUN_ATTEMPT"
            test "$(jq -r .name "$METADATA")" = "$EXPECTED_NAME"
          fi
          case "$RECOVERY_STAGE" in
            ghcr|coworld-intent|coworld-image|coworld-policy|complete) RECOVERED_GHCR_BOUNDARY=true ;;
            *) RECOVERED_GHCR_BOUNDARY=false ;;
          esac
          test "$RECOVERY_STAGE" != complete || test -f "$STATE_ROOT/materialization/summary.json"
          {
            echo "STATE_ROOT=$STATE_ROOT"
            echo "RECOVERY_STAGE=$RECOVERY_STAGE"
            echo "RECOVERED_GHCR_BOUNDARY=$RECOVERED_GHCR_BOUNDARY"
          } >> "$GITHUB_ENV"

      - name: Resolve exact GHCR recovery state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REMOTE_GHCR_AVAILABLE=false
          REMOTE_GHCR_ADOPTED=false
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          set +e
          docker buildx imagetools inspect --raw "$POLICY_TAG" \
            > "$RUNNER_TEMP/remote-policy-manifest.json" \
            2> "$RUNNER_TEMP/remote-policy-inspect-error.txt"
          GHCR_INSPECT_STATUS=$?
          set -e
          REMOTE_GHCR_STATE=$(node .github/scripts/commander-xp-ghcr-adoption.mjs \
            classify-inspect "$POLICY_TAG" "$GHCR_INSPECT_STATUS" \
            "$RUNNER_TEMP/remote-policy-inspect-error.txt")
          if test "$REMOTE_GHCR_STATE" = available; then
            node .github/scripts/commander-xp-ghcr-adoption.mjs discover \
              "$POLICY_TAG" "$RUNNER_TEMP/remote-policy-manifest.json" \
              > "$RUNNER_TEMP/remote-policy-identity.json"
            POLICY_DIGEST=$(jq -r .manifestDigest "$RUNNER_TEMP/remote-policy-identity.json")
            REMOTE_CONFIG_DIGEST=$(jq -r .configDigest "$RUNNER_TEMP/remote-policy-identity.json")
            POLICY_REPO_DIGEST="${POLICY_TAG%:*}@$POLICY_DIGEST"
            if test "$RECOVERED_GHCR_BOUNDARY" = true; then
              test "$POLICY_DIGEST" = "$(jq -r .policyDigest "$STATE_ROOT/ghcr.json")"
              test "$REMOTE_CONFIG_DIGEST" = "$(jq -r .policyConfigDigest "$STATE_ROOT/ghcr.json")"
            elif test "$RECOVERY_STAGE" = intent; then
              REMOTE_GHCR_ADOPTED=true
            else
              echo "Commander public-base GHCR tag exists without retained recovery authority" >&2
              exit 1
            fi
            docker pull "$POLICY_REPO_DIGEST" > "$RUNNER_TEMP/remote-policy-pull.txt"
            docker image inspect "$POLICY_REPO_DIGEST" > "$RUNNER_TEMP/remote-policy-inspect.json"
            test "$(docker image inspect --format '{{.Id}}' "$POLICY_REPO_DIGEST")" = "$REMOTE_CONFIG_DIGEST"
            jq -e --arg source "$SOURCE_SHA" --arg tree "$SOURCE_TREE_SHA" --arg provenance "$SOURCE_PROVENANCE_SHA256" '
              length == 1 and .[0].Architecture == "amd64" and .[0].Os == "linux" and
              .[0].Config.Labels["org.opencontainers.image.source"] == "https://github.com/0xNad/ProxyWar" and
              .[0].Config.Labels["org.opencontainers.image.revision"] == $source and
              .[0].Config.Labels["com.proxywar.commander-public-base.source-sha"] == $source and
              .[0].Config.Labels["com.proxywar.commander-public-base.source-tree-sha"] == $tree and
              .[0].Config.Labels["com.proxywar.commander-public-base.behavior-source-sha"] == $source and
              .[0].Config.Labels["com.proxywar.commander-public-base.behavior-source-tree-sha"] == $tree and
              .[0].Config.Labels["com.proxywar.commander-public-base.adapter-source-sha"] == $source and
              .[0].Config.Labels["com.proxywar.commander-public-base.adapter-source-tree-sha"] == $tree and
              .[0].Config.Labels["com.proxywar.commander-public-base.source-provenance-sha256"] == $provenance and
              .[0].Config.Cmd == ["node","--import","tsx","/app/proxywar/coworld-adapter/src/commander-player.ts"]
            ' "$RUNNER_TEMP/remote-policy-inspect.json" >/dev/null
            for SOURCE_RELATIVE in \
              coworld-adapter/commander-starter/commander-player.ts \
              coworld-adapter/commander-starter/commander-production-runtime.ts \
              src/server/agents/CommanderPromptBuilder.ts \
              src/server/agents/CommanderStateBuilder.ts \
              src/server/agents/StrategicCommanderTypes.ts; do
              case "$SOURCE_RELATIVE" in
                coworld-adapter/commander-starter/commander-player.ts) IMAGE_RELATIVE=coworld-adapter/src/commander-player.ts ;;
                coworld-adapter/commander-starter/commander-production-runtime.ts) IMAGE_RELATIVE=coworld-adapter/src/commander-production-runtime.ts ;;
                *) IMAGE_RELATIVE="$SOURCE_RELATIVE" ;;
              esac
              HOST_SHA=$(sha256sum "$BUILD_SOURCE/$SOURCE_RELATIVE" | cut -d' ' -f1)
              IMAGE_SHA=$(docker run --rm --entrypoint sha256sum "$POLICY_REPO_DIGEST" "/app/proxywar/$IMAGE_RELATIVE" | cut -d' ' -f1)
              test "$IMAGE_SHA" = "$HOST_SHA"
            done
            POLICY_CONFIG_DIGEST="$REMOTE_CONFIG_DIGEST"
            REMOTE_GHCR_AVAILABLE=true
          elif test "$REMOTE_GHCR_STATE" = not-found; then
            test "$RECOVERED_GHCR_BOUNDARY" = false
          else
            echo "Commander public-base GHCR discovery state is invalid" >&2
            exit 1
          fi
          {
            echo "POLICY_CONFIG_DIGEST=$POLICY_CONFIG_DIGEST"
            echo "POLICY_DIGEST=${POLICY_DIGEST:-}"
            echo "POLICY_REPO_DIGEST=${POLICY_REPO_DIGEST:-}"
            echo "REMOTE_GHCR_AVAILABLE=$REMOTE_GHCR_AVAILABLE"
            echo "REMOTE_GHCR_ADOPTED=$REMOTE_GHCR_ADOPTED"
          } >> "$GITHUB_ENV"

      - name: Build immutable public-base intent
        if: inputs.recovery_artifact_id == ''
        run: |
          set -euo pipefail
          CREATED_AT=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)
          install -m 600 "$RUNNER_TEMP/commander-public-base-provenance-v1.json" \
            "$STATE_ROOT/source-provenance.json"
          jq -cS -n \
            --arg source "$SOURCE_SHA" --arg tree "$SOURCE_TREE_SHA" \
            --arg fenceRef "$FENCE_REF" --arg policyTag "$POLICY_TAG" \
            --arg provenance "sha256:$SOURCE_PROVENANCE_SHA256" --arg createdAt "$CREATED_AT" \
            '{schemaVersion:2,authority:"github-actions-commander-public-base-intent-v2",repository:"0xNad/ProxyWar",workflowPath:".github/workflows/commander-public-base.yml",sourceSha:$source,sourceTreeSha:$tree,behaviorSourceSha:$source,behaviorSourceTreeSha:$tree,adapterSourceSha:$source,adapterSourceTreeSha:$tree,fenceRef:$fenceRef,platform:"linux/amd64",ghcr:{tag:$policyTag},sourceProvenanceDigest:$provenance,runtimeEntrypoint:["node","--import","tsx","/app/proxywar/coworld-adapter/src/commander-player.ts"],plan:{imageCount:1,policyCount:1,bedrockEnvironmentCount:0,evalCoworldCount:0,xpRequestCount:0},createdAt:$createdAt}' \
            > "$STATE_ROOT/intent.json"
          node .github/scripts/commander-public-base-recovery.mjs build \
            "$STATE_ROOT" intent "$SOURCE_SHA" "$SOURCE_TREE_SHA" "$FENCE_REF" \
            > "$RUNNER_TEMP/intent-boundary.json"

      - name: Retain immutable intent before mutation
        if: inputs.recovery_artifact_id == ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: commander-public-base-boundary-intent-${{ inputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/commander-public-base-state/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          overwrite: false
          include-hidden-files: false

      - name: Create or verify durable public-base fence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node .github/scripts/commander-xp-main-authorization.mjs "$SOURCE_SHA" \
            > "$RUNNER_TEMP/fence-main-authorization.json"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/${FENCE_REF#refs/}" \
            > "$RUNNER_TEMP/fence.json" 2>/dev/null; then
            :
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="$FENCE_REF" -f sha="$SOURCE_SHA" > "$RUNNER_TEMP/fence.json"
          fi
          test "$(jq -r .ref "$RUNNER_TEMP/fence.json")" = "$FENCE_REF"
          test "$(jq -r .object.sha "$RUNNER_TEMP/fence.json")" = "$SOURCE_SHA"

      - name: Push one exact immutable GHCR image
        if: env.REMOTE_GHCR_AVAILABLE != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node .github/scripts/commander-xp-main-authorization.mjs "$SOURCE_SHA" \
            > "$RUNNER_TEMP/ghcr-main-authorization.json"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$POLICY_TAG" > "$RUNNER_TEMP/policy-push.txt"
          docker buildx imagetools inspect --raw "$POLICY_TAG" > "$RUNNER_TEMP/policy-remote-manifest.json"
          node .github/scripts/commander-xp-ghcr-adoption.mjs inspect \
            "$POLICY_TAG" "$POLICY_CONFIG_DIGEST" "$RUNNER_TEMP/policy-remote-manifest.json" \
            > "$RUNNER_TEMP/policy-ghcr-identity.json"
          POLICY_DIGEST=$(jq -r .manifestDigest "$RUNNER_TEMP/policy-ghcr-identity.json")
          POLICY_REPO_DIGEST="${POLICY_TAG%:*}@$POLICY_DIGEST"
          [[ "$POLICY_REPO_DIGEST" = ghcr.io/0xnad/proxywar-commander-public-base@sha256:* ]]
          {
            echo "POLICY_DIGEST=$POLICY_DIGEST"
            echo "POLICY_REPO_DIGEST=$POLICY_REPO_DIGEST"
          } >> "$GITHUB_ENV"

      - name: Attest public-base image provenance
        id: policy_provenance
        if: env.RECOVERED_GHCR_BOUNDARY != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ghcr.io/0xnad/proxywar-commander-public-base
          subject-digest: ${{ env.POLICY_DIGEST }}
          push-to-registry: true
          show-summary: true

      - name: Verify exact GHCR and attestation boundary
        env:
          GH_TOKEN: ${{ github.token }}
          POLICY_BUNDLE: ${{ steps.policy_provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          if test "$RECOVERED_GHCR_BOUNDARY" = true; then
            jq -e --arg source "$SOURCE_SHA" --arg tree "$SOURCE_TREE_SHA" --arg config "$POLICY_CONFIG_DIGEST" --arg provenance "sha256:$SOURCE_PROVENANCE_SHA256" --arg inventory "$COWORLD_RUNTIME_INVENTORY_SHA256" '
              .schemaVersion == 1 and .authority == "github-actions-attested-commander-public-base-v1" and
              .sourceSha == $source and .sourceTreeSha == $tree and
              .behaviorSourceSha == $source and .behaviorSourceTreeSha == $tree and
              .adapterSourceSha == $source and .adapterSourceTreeSha == $tree and
              .policyConfigDigest == $config and .sourceProvenanceDigest == $provenance and
              .coworldRuntimeInventorySha256 == $inventory and
              (.policyAttestationID | type == "number") and .policyAttestationID > 0 and
              (.policyRepoDigest | test("^ghcr.io/0xnad/proxywar-commander-public-base@sha256:[0-9a-f]{64}$"))
            ' "$STATE_ROOT/ghcr.json" >/dev/null
            POLICY_REPO_DIGEST=$(jq -r .policyRepoDigest "$STATE_ROOT/ghcr.json")
            POLICY_DIGEST=$(jq -r .policyDigest "$STATE_ROOT/ghcr.json")
            POLICY_BUILD_PROVENANCE_DIGEST=$(jq -r .policyBuildProvenanceDigest "$STATE_ROOT/ghcr.json")
            test "$POLICY_DIGEST" = "${POLICY_REPO_DIGEST##*@}"
            test "sha256:$(sha256sum "$STATE_ROOT/attestations/policy.jsonl" | cut -d' ' -f1)" = "$POLICY_BUILD_PROVENANCE_DIGEST"
          else
            [[ '${{ steps.policy_provenance.outputs.attestation-id }}' =~ ^[1-9][0-9]*$ ]]
            mkdir -p "$STATE_ROOT/attestations"
            install -m 600 "$POLICY_BUNDLE" "$STATE_ROOT/attestations/policy.jsonl"
            POLICY_BUILD_PROVENANCE_DIGEST="sha256:$(sha256sum "$POLICY_BUNDLE" | cut -d' ' -f1)"
            jq -cS -n \
              --arg source "$SOURCE_SHA" --arg tree "$SOURCE_TREE_SHA" \
              --arg repoDigest "$POLICY_REPO_DIGEST" --arg digest "$POLICY_DIGEST" \
              --arg config "$POLICY_CONFIG_DIGEST" --arg build "$POLICY_BUILD_PROVENANCE_DIGEST" \
              --arg provenance "sha256:$SOURCE_PROVENANCE_SHA256" \
              --arg inventory "$COWORLD_RUNTIME_INVENTORY_SHA256" \
              --argjson attestationID '${{ steps.policy_provenance.outputs.attestation-id }}' \
              '{schemaVersion:1,authority:"github-actions-attested-commander-public-base-v1",sourceSha:$source,sourceTreeSha:$tree,behaviorSourceSha:$source,behaviorSourceTreeSha:$tree,adapterSourceSha:$source,adapterSourceTreeSha:$tree,policyRepoDigest:$repoDigest,policyDigest:$digest,policyConfigDigest:$config,sourceProvenanceDigest:$provenance,policyBuildProvenanceDigest:$build,policyAttestationID:$attestationID,coworldRuntimeInventorySha256:$inventory}' \
              > "$STATE_ROOT/ghcr.json"
          fi
          gh attestation verify "oci://$POLICY_REPO_DIGEST" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "$STATE_ROOT/attestations/policy.jsonl" \
            --cert-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/commander-public-base.yml@refs/heads/main" \
            --source-ref refs/heads/main --source-digest "$SOURCE_SHA" \
            --signer-digest "$SOURCE_SHA" --deny-self-hosted-runners
          {
            echo "POLICY_REPO_DIGEST=$POLICY_REPO_DIGEST"
            echo "POLICY_DIGEST=$POLICY_DIGEST"
            echo "POLICY_BUILD_PROVENANCE_DIGEST=$POLICY_BUILD_PROVENANCE_DIGEST"
          } >> "$GITHUB_ENV"

      - name: Build immutable GHCR boundary
        if: env.RECOVERED_GHCR_BOUNDARY != 'true'
        run: |
          set -euo pipefail
          node .github/scripts/commander-public-base-recovery.mjs build \
            "$STATE_ROOT" ghcr "$SOURCE_SHA" "$SOURCE_TREE_SHA" "$FENCE_REF" \
            > "$RUNNER_TEMP/ghcr-boundary.json"

      - name: Retain immutable GHCR boundary
        if: env.RECOVERED_GHCR_BOUNDARY != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: commander-public-base-boundary-ghcr-${{ inputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/commander-public-base-state/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          overwrite: false
          include-hidden-files: false

      - name: Build exact Coworld materialization intent
        id: coworld_intent
        env:
          COWORLD_API_TOKEN: ${{ secrets.COWORLD_API_TOKEN }}
        run: |
          set -euo pipefail
          POLICY_IDENTITY_JSON=$(jq -cS -n --arg source "$SOURCE_SHA" --arg tree "$SOURCE_TREE_SHA" \
            --arg image "${POLICY_REPO_DIGEST%%@*}" --arg digest "$POLICY_DIGEST" \
            --arg build "$POLICY_BUILD_PROVENANCE_DIGEST" \
            --arg provenance "sha256:$SOURCE_PROVENANCE_SHA256" \
            '{sourceSha:$source,sourceTreeSha:$tree,sourceProvenanceDigest:$provenance,buildProvenanceDigest:$build,ociImage:$image,ociDigest:$digest,runtimeEntrypoint:["node","--import","tsx","/app/proxywar/coworld-adapter/src/commander-player.ts"],purpose:"commander-public-base-materialization-v2"}')
          POLICY_IDENTITY_SHA256=$(printf '%s' "$POLICY_IDENTITY_JSON" | sha256sum | cut -d' ' -f1)
          # Coworld policy names are capped at 64 characters. Use the complete
          # identity as the name so remote adoption never relies on a truncated hash.
          POLICY_NAME="$POLICY_IDENTITY_SHA256"
          {
            echo "POLICY_IDENTITY_SHA256=$POLICY_IDENTITY_SHA256"
            echo "POLICY_NAME=$POLICY_NAME"
          } >> "$GITHUB_ENV"
          if test -f "$STATE_ROOT/coworld-intent.json"; then
            jq -e --arg source "$SOURCE_SHA" --arg tree "$SOURCE_TREE_SHA" \
              --arg image "$POLICY_REPO_DIGEST" --arg digest "$POLICY_DIGEST" \
              --arg build "$POLICY_BUILD_PROVENANCE_DIGEST" \
              --arg provenance "sha256:$SOURCE_PROVENANCE_SHA256" \
              --arg policy "$POLICY_NAME" --arg identity "$POLICY_IDENTITY_SHA256" '
              .schemaVersion == 1 and .authority == "github-actions-commander-public-base-coworld-intent-v1" and
              .sourceSha == $source and .sourceTreeSha == $tree and
              .behaviorSourceSha == $source and .adapterSourceSha == $source and
              .ociImage == $image and .ociDigest == $digest and
              .buildProvenanceDigest == $build and .sourceProvenanceDigest == $provenance and
              .policyName == $policy and .policyIdentitySha256 == $identity and
              .runtimeEntrypoint == ["node","--import","tsx","/app/proxywar/coworld-adapter/src/commander-player.ts"] and
              .plan == {imageCount:1,policyCount:1,bedrockEnvironmentCount:0}
            ' "$STATE_ROOT/coworld-intent.json" >/dev/null
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node .github/scripts/coworld-authenticated-command.mjs commander-public-base-materialize check \
            --image="$POLICY_REPO_DIGEST" --policy-name="$POLICY_NAME" \
            --policy-identity-sha256="$POLICY_IDENTITY_SHA256" --source-sha="$SOURCE_SHA" \
            --source-tree-sha="$SOURCE_TREE_SHA" \
            --source-provenance-digest="sha256:$SOURCE_PROVENANCE_SHA256" \
            --build-provenance-digest="$POLICY_BUILD_PROVENANCE_DIGEST" \
            --oci-digest="$POLICY_DIGEST" \
            > "$RUNNER_TEMP/materialization-preflight.json"
          jq -e '.ok == true and .namesAvailable == 1' "$RUNNER_TEMP/materialization-preflight.json" >/dev/null
          CREATED_AT=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)
          jq -cS -n --arg source "$SOURCE_SHA" --arg tree "$SOURCE_TREE_SHA" \
            --arg image "$POLICY_REPO_DIGEST" --arg digest "$POLICY_DIGEST" \
            --arg build "$POLICY_BUILD_PROVENANCE_DIGEST" \
            --arg provenance "sha256:$SOURCE_PROVENANCE_SHA256" --arg createdAt "$CREATED_AT" \
            --arg policy "$POLICY_NAME" --arg identity "$POLICY_IDENTITY_SHA256" \
            '{schemaVersion:1,authority:"github-actions-commander-public-base-coworld-intent-v1",sourceSha:$source,sourceTreeSha:$tree,behaviorSourceSha:$source,behaviorSourceTreeSha:$tree,adapterSourceSha:$source,adapterSourceTreeSha:$tree,ociImage:$image,ociDigest:$digest,buildProvenanceDigest:$build,sourceProvenanceDigest:$provenance,policyName:$policy,policyIdentitySha256:$identity,runtimeEntrypoint:["node","--import","tsx","/app/proxywar/coworld-adapter/src/commander-player.ts"],plan:{imageCount:1,policyCount:1,bedrockEnvironmentCount:0},allowExactRemoteAdoptionAfterFailure:true,createdAt:$createdAt}' \
            > "$STATE_ROOT/coworld-intent.json"
          node .github/scripts/commander-public-base-recovery.mjs build \
            "$STATE_ROOT" coworld-intent "$SOURCE_SHA" "$SOURCE_TREE_SHA" "$FENCE_REF" \
            > "$RUNNER_TEMP/coworld-intent-boundary.json"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Retain immutable Coworld intent before materialization
        if: steps.coworld_intent.outputs.created == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: commander-public-base-boundary-coworld-intent-${{ inputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/commander-public-base-state/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          overwrite: false
          include-hidden-files: false

      - name: Materialize exactly one Coworld image
        id: materialize_image
        if: env.RECOVERY_STAGE != 'complete'
        continue-on-error: true
        env:
          COWORLD_API_TOKEN: ${{ secrets.COWORLD_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node .github/scripts/commander-xp-main-authorization.mjs "$SOURCE_SHA" \
            > "$RUNNER_TEMP/materialization-main-authorization.json"
          OUTPUT_PARENT=$(mktemp -d "$RUNNER_TEMP/commander-public-base-output.XXXXXX")
          chmod 700 "$OUTPUT_PARENT"
          OUTPUT="$OUTPUT_PARENT/materialization"
          RECOVERY_ARGS=()
          if test -d "$STATE_ROOT/materialization"; then
            RECOVERY_ARGS+=("--recovery=$STATE_ROOT/materialization")
          fi
          case "$RECOVERY_STAGE" in
            coworld-intent|coworld-image|coworld-policy) ALLOW_REMOTE_ADOPTION=true ;;
            *) ALLOW_REMOTE_ADOPTION=false ;;
          esac
          set +e
          node .github/scripts/coworld-authenticated-command.mjs commander-public-base-materialize upload \
            --image="$POLICY_REPO_DIGEST" --policy-name="$POLICY_NAME" \
            --policy-identity-sha256="$POLICY_IDENTITY_SHA256" \
            --source-sha="$SOURCE_SHA" --source-tree-sha="$SOURCE_TREE_SHA" \
            --source-provenance-digest="sha256:$SOURCE_PROVENANCE_SHA256" \
            --build-provenance-digest="$POLICY_BUILD_PROVENANCE_DIGEST" \
            --oci-digest="$POLICY_DIGEST" --allow-remote-adoption="$ALLOW_REMOTE_ADOPTION" \
            --output="$OUTPUT" \
            "${RECOVERY_ARGS[@]}" > "$RUNNER_TEMP/materialization-result.json"
          STATUS=$?
          set -e
          if test -d "$OUTPUT"; then
            mkdir -p "$STATE_ROOT/materialization"
            cp -R "$OUTPUT"/. "$STATE_ROOT/materialization"/
          fi
          test "$STATUS" = 0 || exit "$STATUS"
          jq -e '.ok == true and .imageCount == 1 and .policyCount == 1' "$RUNNER_TEMP/materialization-result.json" >/dev/null

      - name: Build exact complete or partial Coworld boundary
        id: materialization_boundary
        if: always() && steps.materialize_image.outcome != 'skipped'
        run: |
          set -euo pipefail
          if test -f "$STATE_ROOT/materialization/summary.json"; then
            STAGE=complete
          elif test -f "$STATE_ROOT/materialization/policy.json"; then
            STAGE=coworld-policy
          elif test -f "$STATE_ROOT/materialization/image.json"; then
            STAGE=coworld-image
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if test "$STAGE" = complete; then
            jq -e --arg source "$SOURCE_SHA" --arg tree "$SOURCE_TREE_SHA" '
              .sourceSha == $source and .sourceTreeSha == $tree and
              .behaviorSourceSha == $source and .behaviorSourceTreeSha == $tree and
              .adapterSourceSha == $source and .adapterSourceTreeSha == $tree and
              .imageCount == 1 and .policyCount == 1 and
              .bedrockEnvironmentCount == 0
            ' "$STATE_ROOT/materialization/summary.json" >/dev/null
          fi
          node .github/scripts/commander-public-base-recovery.mjs build \
            "$STATE_ROOT" "$STAGE" "$SOURCE_SHA" "$SOURCE_TREE_SHA" "$FENCE_REF" \
            > "$RUNNER_TEMP/materialization-boundary.json"
          {
            echo "ready=true"
            echo "stage=$STAGE"
          } >> "$GITHUB_OUTPUT"

      - name: Retain immutable complete or partial Coworld boundary
        if: always() && steps.materialization_boundary.outputs.ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: commander-public-base-boundary-${{ steps.materialization_boundary.outputs.stage }}-${{ inputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/commander-public-base-state/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          overwrite: false
          include-hidden-files: false

      - name: Stop after retaining a partial Coworld boundary
        if: steps.materialize_image.outcome == 'failure'
        run: exit 1

      - name: Verify terminal single-image handoff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node .github/scripts/commander-xp-main-authorization.mjs "$SOURCE_SHA" \
            > "$RUNNER_TEMP/terminal-main-authorization.json"
          node .github/scripts/commander-public-base-recovery.mjs validate \
            "$STATE_ROOT" "$SOURCE_SHA" "$SOURCE_TREE_SHA" "$FENCE_REF" \
            > "$RUNNER_TEMP/terminal-boundary.json"
          test "$(jq -r .stage "$RUNNER_TEMP/terminal-boundary.json")" = complete
          jq -e --arg source "$SOURCE_SHA" --arg tree "$SOURCE_TREE_SHA" --arg digest "$POLICY_DIGEST" --arg repoDigest "$POLICY_REPO_DIGEST" '
            .sourceSha == $source and .sourceTreeSha == $tree and
            .behaviorSourceSha == $source and .adapterSourceSha == $source and
            .imageCount == 1 and .policyCount == 1 and .bedrockEnvironmentCount == 0 and
            .ociDigest == $digest and .ociImage == ($repoDigest | split("@")[0]) and
            (.containerImage.image_digest | test("^sha256:[0-9a-f]{64}$")) and
            (.containerImage.public_image_uri | test("^public\\.ecr\\.aws/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$")) and
            (.policyVersion.id | type == "string") and .policyVersion.name == .policyName and
            .runtimeEntrypoint == ["node","--import","tsx","/app/proxywar/coworld-adapter/src/commander-player.ts"]
          ' "$STATE_ROOT/materialization/summary.json" >/dev/null
          PUBLIC_IMAGE_URI=$(jq -r .containerImage.public_image_uri "$STATE_ROOT/materialization/summary.json")
          docker pull "$PUBLIC_IMAGE_URI" > "$RUNNER_TEMP/public-image-pull.txt"
          docker image inspect "$PUBLIC_IMAGE_URI" > "$RUNNER_TEMP/public-image-inspect.json"
          jq -e --arg source "$SOURCE_SHA" --arg tree "$SOURCE_TREE_SHA" --arg provenance "$SOURCE_PROVENANCE_SHA256" '
            length == 1 and .[0].Architecture == "amd64" and .[0].Os == "linux" and
            .[0].Config.Labels["org.opencontainers.image.revision"] == $source and
            .[0].Config.Labels["com.proxywar.commander-public-base.source-tree-sha"] == $tree and
            .[0].Config.Labels["com.proxywar.commander-public-base.source-provenance-sha256"] == $provenance and
            .[0].Config.Cmd == ["node","--import","tsx","/app/proxywar/coworld-adapter/src/commander-player.ts"]
          ' "$RUNNER_TEMP/public-image-inspect.json" >/dev/null
          docker run --rm --entrypoint node "$PUBLIC_IMAGE_URI" --import tsx -e \
            'Promise.all([import("/app/proxywar/coworld-adapter/src/commander-player.ts"),import("/app/proxywar/coworld-adapter/src/commander-production-runtime.ts")])'
          for SOURCE_RELATIVE in \
            coworld-adapter/commander-starter/commander-player.ts \
            coworld-adapter/commander-starter/commander-production-runtime.ts \
            src/server/agents/CommanderPromptBuilder.ts \
            src/server/agents/CommanderStateBuilder.ts \
            src/server/agents/StrategicCommanderTypes.ts; do
            case "$SOURCE_RELATIVE" in
              coworld-adapter/commander-starter/commander-player.ts) IMAGE_RELATIVE=coworld-adapter/src/commander-player.ts ;;
              coworld-adapter/commander-starter/commander-production-runtime.ts) IMAGE_RELATIVE=coworld-adapter/src/commander-production-runtime.ts ;;
              *) IMAGE_RELATIVE="$SOURCE_RELATIVE" ;;
            esac
            HOST_SHA=$(sha256sum "$BUILD_SOURCE/$SOURCE_RELATIVE" | cut -d' ' -f1)
            PUBLIC_SHA=$(docker run --rm --entrypoint sha256sum "$PUBLIC_IMAGE_URI" "/app/proxywar/$IMAGE_RELATIVE" | cut -d' ' -f1)
            test "$PUBLIC_SHA" = "$HOST_SHA"
          done
          {
            echo "### Commander public base"
            echo "- Source: \`$SOURCE_SHA\`"
            echo "- Source tree: \`$SOURCE_TREE_SHA\`"
            echo "- GHCR: \`$POLICY_REPO_DIGEST\`"
            echo "- Coworld image: \`$(jq -r .containerImage.public_image_uri "$STATE_ROOT/materialization/summary.json")\`"
            echo "- Materialization policy: \`$(jq -r .policyVersion.id "$STATE_ROOT/materialization/summary.json")\`"
            echo "- Runtime: \`node --import tsx /app/proxywar/coworld-adapter/src/commander-player.ts\`"
            echo "- Cardinality: one image, one exact-entrypoint materialization policy, zero environments, zero eval Coworlds, zero XP requests"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove residual ephemeral Coworld credential homes
        if: always()
        run: |
          set -euo pipefail
          find "$RUNNER_TEMP" -maxdepth 1 -type d -name 'coworld-auth-*' -exec rm -rf -- {} +
