name: 🔐 Trusted PR admission

on:
  pull_request_target:
    types:
      [
        opened,
        reopened,
        synchronize,
        ready_for_review,
        labeled,
        unlabeled,
        closed,
      ]
  pull_request_review:
    types: [submitted, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  workflow_run:
    workflows: ["🧪 CI", "🏷️ Rename guard"]
    types: [completed]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      pr_numbers:
        description: Comma-separated PR numbers for a metadata-only audit
        required: true
        type: string
      dry_run:
        description: Inspect only; never label, merge, comment, enqueue, or dispatch
        required: true
        default: true
        type: boolean
      historical:
        description: Ignore current-base/open-state drift for historical policy audits
        required: true
        default: false
        type: boolean

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  admit:
    name: Exact-author trusted admission
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # This privileged workflow checks out only protected main. It never checks out
      # a PR head, merge ref, fork, or artifact, and never executes contributor code.
      - name: Checkout protected admission code from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          submodules: false
      - name: Mint short-lived trusted-release GitHub App token
        id: trusted_app
        if: ${{ vars.TRUSTED_RELEASE_APP_CLIENT_ID != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.TRUSTED_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.TRUSTED_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-actions: write
          permission-checks: read
          permission-contents: write
          permission-issues: write
          permission-metadata: read
          permission-pull-requests: write
          permission-workflows: write
      - name: Evaluate exact PR metadata and enable auto-merge
        env:
          GITHUB_TOKEN: ${{ steps.trusted_app.outputs.token || github.token }}
          BRANCH_REFRESH_TOKEN_READY: ${{ steps.trusted_app.outcome == 'success' && 'true' || 'false' }}
          TRUSTED_RELEASE_APP_SLUG: ${{ steps.trusted_app.outputs.app-slug || '' }}
          PR_NUMBERS: ${{ inputs.pr_numbers || '' }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          HISTORICAL: ${{ inputs.historical && 'true' || 'false' }}
        run: node .github/scripts/trusted-pr-admission.mjs
