name: 🧪 CI

on:
  merge_group:
    types:
      - checks_requested
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: false
      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build-prod
      - uses: actions/upload-artifact@v7
        with:
          path: out/index.html
          retention-days: 1
  test:
    name: 🔬 Test (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # Sharded 2026-08-04: the single-job coverage run has cancelled at the
    # 45-min cap on EVERY main/PR run since 2026-08-02T00:14Z (verified via
    # GH Actions run history — independent of any one PR's content; a prior
    # cap raise from 30 to 45 min on 2026-07-11 already exhausted that same
    # remedy). Local reproduction of the exact `npm run test:coverage`
    # command showed steady, non-hanging progress, but individual CPU-bound
    # simulation tests (AgentLeagueMatch, SimRollout*, ReplayPremiere
    # long-runtime/production-cadence) take 15-75s each under coverage
    # instrumentation, projecting a full single-job run to ~80-160 min. A
    # deterministic 4-way Vitest --shard split (verified: the union of all
    # four shards' `vitest list --shard=N/4` file sets exactly equals the
    # unsharded `vitest list` file set — 113+112+112+112=449 files, zero
    # duplicates/omissions) restores bounded per-job completion while every
    # test file still runs under coverage.
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: false
      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - run: npm run test:coverage -- --shard=${{ matrix.shard }}/4

  eslint:
    name: 🔍 ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npx eslint --format gha

  prettier:
    name: 🎨 Prettier
    if: ${{ github.repository == 'openfrontio/OpenFrontIO' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npx prettier --check .

  gen-maps:
    name: 🗺️ Generated maps up to date
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
      - uses: actions/setup-go@v6
        with:
          go-version-file: map-generator/go.mod
          cache-dependency-path: map-generator/go.sum
      - run: npm ci
      - run: npm run gen-maps
      - name: Check for diff
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated maps are out of date — run 'npm run gen-maps' and commit the result."
            git status --short
            git --no-pager diff
            exit 1
          fi
