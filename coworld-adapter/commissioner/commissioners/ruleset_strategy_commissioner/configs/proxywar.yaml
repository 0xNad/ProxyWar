schedule_interval_minutes: 30

# A 25-entrant competition on the 16-seat rung (since 0.1.32) schedules ten
# rolling-window jobs; on the 12-seat rung it was fourteen.
# Admission is acknowledgement-paced (one ScheduleEpisodes message per
# episode, the next only after episodes_accepted), so this cap bounds steady
# concurrency only -- it is not a burst size. The July player_never_started
# class was platform-side and never attributed to a specific concurrency
# level, so this cap is exposure control, not a proven safety line. Raised
# from three on 2026-08-10 to roughly halve round wall-time and restore
# six-hour round-ceiling headroom. If
# pod-not-found/player_never_started recurs, drop back to three. Explicit zero
# staggering avoids consuming an episode's timeout budget before its request is
# sent. The duty-cycle load formula
# (target_load * usable_window / worker_seconds_per_episode, clamped to this
# ceiling) only binds below it for genuinely short timeouts: the 180s qualifier
# resolves to three, but the 300s certification fixture resolves to five, same
# as league rounds. An earlier version of this comment claimed certification
# stayed at three -- that was true only while max_in_flight was 3 and was
# falsified by raising it (caught in the 2026-08-11 round-1357 audit).
dispatch_throttle:
  enabled: true
  min_in_flight: 1
  max_in_flight: 5
  stagger_seconds: 0

scoring:
  # Per-episode win rate, not raw score: a conquest game's winner is whoever ends the episode
  # dominant, not whoever racked up the biggest score number. The current-form leaderboard keeps
  # one continuous history as the population ladder expands through 2p/4p/8p/12p; old-rung evidence
  # decays under the same rule instead of resetting or being normalized at a rung transition.
  round_score: win
  leaderboard:
    # Current form is the player-level EWMA of mean round win rate. Twenty-four completed rounds is
    # about twelve hours at the nominal half-hour cadence. Scores stay on a readable 0-100 scale.
    # A five-round placement period prevents one lucky first result from leading the established board.
    type: ewma
    half_life_rounds: 24
    score_scale: 100
    provisional_min_rounds: 5

defaults:
  # shuffled_window (2026-08-12): rolling_window seated a one-entrant-step window
  # over a per-round-STABLE entrant order, so per-round coverage was a fixed
  # triangle over list position -- mid-list entrants sat in ~86-100% of a round's
  # episodes while both ends of the list got only the single guaranteed
  # appearance (~7-14%). Measured live over 08-08..08-11 (rounds 1270-1365):
  # position 0 played 9% of episodes, positions 11-12 played 91-92%, and the
  # tail-pinned house seat played 7.5-12%, decaying its EWMA from rank 1 to 10
  # on seating exposure alone. shuffled_window redraws the entrant permutation
  # every scheduling (wall-clock seeded, never reused on re-schedule), keeping
  # the same episode count and the every-entrant >=1 appearance guarantee while
  # equalizing expected coverage at windows*seats/entrants for every list
  # position. Window construction itself is unchanged; only the order the
  # windows walk is re-randomized. See common/ruleset_strategy/scheduling.py.
  seating: shuffled_window
  # `strict` is intentional, not a placeholder: the custom commissioner's ladder always routes each
  # Competition round to the largest declared variant whose seat count is <= the real champion count
  # (see proxywar_app.py), so num_agents <= len(primary_entries) is a structural invariant here, not
  # a hope -- fill_seats never has to fire. `strict` makes that invariant loud (an immediate error)
  # instead of silently duplicating a policy into its own opponent if the invariant were ever broken.
  fill_seats: strict
  min_entries_to_start: 2
  stage:
    label: Competition round
    episodes: 4
    min_episodes_per_entrant: 1

divisions:
  qualifiers:
    name: Qualifiers
    level: -99
    match:
      name: Qualifiers
      type: staging
    entrants: qualifying
    min_entries_to_start: 1
    stages:
      - id: crash_check
        schedule:
          label: Crash check
          self_play: true
          attempts: 2
          min_episodes_per_entrant: 2
        on_round_complete:
          - id: qualified
            criteria:
              completed_episodes_gt: 0
            actions:
              - type: update_membership
                division: competition
                status: competing
                substatus: champion
          - id: disqualified
            criteria: otherwise
            actions:
              - type: update_membership
                status: disqualified
                substatus: inactive

  competition:
    name: Competition
    level: 1
    match:
      type: competition
    entrants: champions
    min_entries_to_start: 2
