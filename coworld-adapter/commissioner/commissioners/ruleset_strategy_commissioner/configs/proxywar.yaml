schedule_interval_minutes: 30

# A 25-entrant, 12-seat competition currently schedules fourteen rolling-window
# jobs. Admission is acknowledgement-paced (one ScheduleEpisodes message per
# episode, the next only after episodes_accepted), so this cap bounds steady
# concurrency only -- it is not a burst size. Five concurrent 12-seat episodes
# stay below the six-at-once admission shape that coincided with the July
# player_never_started failures; raised from three on 2026-08-10 to roughly
# halve round wall-time and restore six-hour round-ceiling headroom. If
# pod-not-found/player_never_started recurs, drop back to three. Explicit zero
# staggering avoids consuming an episode's timeout budget before its request is
# sent. Short-timeout certification smokes stay at three because the duty-cycle
# load formula (target_load * usable_window / worker_seconds_per_episode) binds
# before this ceiling does.
dispatch_throttle:
  enabled: true
  min_in_flight: 1
  max_in_flight: 5
  stagger_seconds: 0

scoring:
  # Per-episode win rate, not raw score: a conquest game's winner is whoever ends the episode
  # dominant, not whoever racked up the biggest score number. The current-form leaderboard keeps
  # one continuous history as the population ladder expands through 2p/4p/8p/12p; old-rung evidence
  # decays under the same rule instead of resetting or being normalized at a rung transition.
  round_score: win
  leaderboard:
    # Current form is the player-level EWMA of mean round win rate. Twenty-four completed rounds is
    # about twelve hours at the nominal half-hour cadence. Scores stay on a readable 0-100 scale.
    # A five-round placement period prevents one lucky first result from leading the established board.
    type: ewma
    half_life_rounds: 24
    score_scale: 100
    provisional_min_rounds: 5

defaults:
  seating: rolling_window
  # `strict` is intentional, not a placeholder: the custom commissioner's ladder always routes each
  # Competition round to the largest declared variant whose seat count is <= the real champion count
  # (see proxywar_app.py), so num_agents <= len(primary_entries) is a structural invariant here, not
  # a hope -- fill_seats never has to fire. `strict` makes that invariant loud (an immediate error)
  # instead of silently duplicating a policy into its own opponent if the invariant were ever broken.
  fill_seats: strict
  min_entries_to_start: 2
  stage:
    label: Competition round
    episodes: 4
    min_episodes_per_entrant: 1

divisions:
  qualifiers:
    name: Qualifiers
    level: -99
    match:
      name: Qualifiers
      type: staging
    entrants: qualifying
    min_entries_to_start: 1
    stages:
      - id: crash_check
        schedule:
          label: Crash check
          self_play: true
          attempts: 2
          min_episodes_per_entrant: 2
        on_round_complete:
          - id: qualified
            criteria:
              completed_episodes_gt: 0
            actions:
              - type: update_membership
                division: competition
                status: competing
                substatus: champion
          - id: disqualified
            criteria: otherwise
            actions:
              - type: update_membership
                status: disqualified
                substatus: inactive

  competition:
    name: Competition
    level: 1
    match:
      type: competition
    entrants: champions
    min_entries_to_start: 2
